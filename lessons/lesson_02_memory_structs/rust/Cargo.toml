[package]
name = "lesson_02_memory_structs_rust"
version = "0.1.0"
authors = ["Vitalii Kononenko <vitalii@getruck.co>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-backtrace = { version = "0.19.0", features = [
    "esp32",
    "panic-handler",
    "println",
] }
esp-hal = { version = "1.0.0", features = [ "esp32", "unstable" ] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }
log = { version = "0.4.26" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
